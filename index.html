<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#060a08" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>YevaTrade</title>
    <style>
      /* Splash PWA — CSS-only lifecycle so a JS failure never blocks the app */
      #yeva-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #060a08;
        color: #c8d4c9;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        pointer-events: none;
        animation: yeva-splash-lifecycle 1.6s ease-in-out forwards;
      }
      #yeva-splash.yeva-splash--hide {
        animation: none;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #yeva-splash .yeva-splash__glow {
        position: absolute;
        width: min(70vw, 280px);
        height: min(70vw, 280px);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 212, 160, 0.28) 0%, rgba(0, 212, 160, 0.06) 45%, transparent 70%);
        filter: blur(8px);
        animation: yeva-splash-glow 1.5s ease-in-out forwards;
      }
      #yeva-splash .yeva-splash__logo {
        position: relative;
        width: 88px;
        height: 88px;
        animation: yeva-splash-logo 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #yeva-splash .yeva-splash__logo svg {
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 0 18px rgba(0, 212, 160, 0.55));
      }
      #yeva-splash .yeva-splash__brand {
        position: relative;
        margin: 0.35rem 0 0;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #e8f5ec;
        animation: yeva-splash-text 1.5s ease-out 0.15s both;
      }
      #yeva-splash .yeva-splash__welcome {
        position: relative;
        margin: 0.85rem 0 0;
        font-size: 1.05rem;
        font-weight: 600;
        color: #c8d4c9;
        animation: yeva-splash-text 1.5s ease-out 0.28s both;
      }
      #yeva-splash .yeva-splash__tagline {
        position: relative;
        margin: 0.15rem 0 0;
        font-size: 0.85rem;
        font-weight: 400;
        letter-spacing: 0.02em;
        color: #6b8a6e;
        animation: yeva-splash-text 1.5s ease-out 0.4s both;
      }
      @keyframes yeva-splash-logo {
        0% { opacity: 0; transform: scale(0.82); }
        55% { opacity: 1; transform: scale(1.04); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes yeva-splash-glow {
        0% { opacity: 0; transform: scale(0.7); }
        50% { opacity: 1; transform: scale(1.05); }
        100% { opacity: 0.85; transform: scale(1); }
      }
      @keyframes yeva-splash-text {
        0% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes yeva-splash-lifecycle {
        0%, 78% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
      }
    </style>
  </head>
  <body>
    <!-- Splash first-paint: before React/router. Auto-hides via CSS if JS fails. -->
    <div id="yeva-splash" role="presentation" aria-hidden="true">
      <div class="yeva-splash__glow" aria-hidden="true"></div>
      <div class="yeva-splash__logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="yevaSplashGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
              <stop stop-color="#00d4a0" />
              <stop offset="1" stop-color="#d4a843" />
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="28" stroke="url(#yevaSplashGrad)" stroke-width="2" stroke-linecap="square" stroke-dasharray="12 8" opacity="0.85" />
          <path d="M32 14 L22 34 H27 L32 24 L37 34 H42 L32 14 Z" fill="#00d4a0" />
          <path d="M24 38 H40 V42 H24 V38 Z" fill="#d4a843" opacity="0.9" />
          <path d="M28 44 H36 V48 H28 V44 Z" fill="#00d4a0" opacity="0.6" />
        </svg>
      </div>
      <p class="yeva-splash__brand">YevaTrade</p>
      <p class="yeva-splash__welcome">Bem-vindo</p>
      <p class="yeva-splash__tagline">Trading automatizado 24/7</p>
    </div>
    <noscript>
      <style>#yeva-splash{display:none!important}</style>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
