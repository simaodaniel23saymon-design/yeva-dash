<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060a08" />
    <title>YevaTrade · Recuperar</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #060a08;
        color: #e8eee9;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        padding: 24px;
        text-align: center;
      }
      h1 { font-size: 18px; margin: 0 0 12px; font-weight: 600; }
      p { font-size: 12px; color: #9aa89e; line-height: 1.5; max-width: 320px; margin: 0 auto 20px; }
      button {
        border: 1px solid rgba(0, 212, 160, 0.35);
        background: rgba(0, 212, 160, 0.12);
        color: #00d4a0;
        padding: 12px 16px;
        font: inherit;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .ok { color: #00d4a0; margin-top: 16px; font-size: 11px; display: none; }
    </style>
  </head>
  <body>
    <div>
      <h1>Recuperar YevaTrade</h1>
      <p>
        Limpa apenas o cache do service worker desta app e reabre o dashboard.
        Não apaga login noutro sítio nem dados do telemóvel.
      </p>
      <button id="btn" type="button">Limpar cache e abrir</button>
      <p class="ok" id="ok">Cache limpo. A redireccionar…</p>
    </div>
    <script>
      document.getElementById('btn').onclick = async function () {
        try {
          if ('caches' in window) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            for (var i = 0; i < regs.length; i++) {
              try { await regs[i].unregister(); } catch (e) {}
            }
          }
          try { sessionStorage.clear(); } catch (e) {}
        } catch (e) {}
        document.getElementById('ok').style.display = 'block';
        setTimeout(function () {
          location.replace('/dashboard?_recover=' + Date.now());
        }, 400);
      };
    </script>
  </body>
</html>
